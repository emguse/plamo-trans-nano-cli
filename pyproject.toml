[project]
name = "plamo-trans"
version = "0.1.0"
description = "CLI for PLaMo 3 Translate (GGUF) via llama.cpp server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "huggingface_hub>=0.24"]

[project.scripts]
plamo-trans = "plamo_trans.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plamo_trans"]
